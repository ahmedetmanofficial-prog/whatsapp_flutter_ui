name: my_first_app
description: Flutter app with all record encoder support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.3.0'

dependencies:
  google_fonts: ^6.2.1
  camera: ^0.11.0+2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  video_player: ^2.11.1
  speech_to_text: ^7.4.0
  audioplayers: ^6.6.0
  flutter_tts: ^4.2.5
  flutter_webrtc: ^1.4.1
  record: ^5.2.1
  permission_handler: ^11.4.0
dependency_overrides:
  record_linux: ^1.3.0
  ############################################
  # Audio Recording - Core
  ############################################
  record: ^5.1.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  ############################################
  # Audio Playback & Waveform
  ############################################
  just_audio: ^0.9.35
  audio_waveforms: ^1.2.0
  flutter_sound: ^9.2.12

  ############################################
  # Firebase Integration
  ############################################
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.4.0
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.1.0

  ############################################
  # State Management
  ############################################
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  get_it: ^7.6.7
  riverpod: ^2.4.9

  ############################################
  # Networking & Storage
  ############################################
  dio: ^5.4.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  ############################################
  # UI Components
  ############################################
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  shimmer: ^3.0.0

  ############################################
  # Utilities
  ############################################
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.1.0
  path: ^1.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Asset folders
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/audio/

  # Font configuration

  ############################################
  # Notes about record package:
  # record 5.1.0 supports these encoders in code:
  # - AudioEncoder.aacLc
  # - AudioEncoder.aacHe
  # - AudioEncoder.aacEld
  # - AudioEncoder.amrNb
  # - AudioEncoder.amrWb
  # - AudioEncoder.opus
  # - AudioEncoder.wav
  # - AudioEncoder.pcm16bits
  #
  # You use them like this in Dart:
  # await record.start(
  #   encoder: AudioEncoder.opus,
  # )
  ############################################

# End of pubspec.yaml
# To install: flutter pub get
# To run: flutter run


